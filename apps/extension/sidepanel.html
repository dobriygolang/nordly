<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nordly</title>
    <link rel="stylesheet" href="/src/panel.css" />
  </head>
  <body>
    <main>
      <section id="pair">
        <p id="pair-copy"></p>
        <input id="code" autocomplete="off" spellcheck="false" />
        <button id="save-code" type="button"></button>
      </section>
      <section id="capture" hidden>
        <select id="note"></select>
        <input id="word" autocomplete="off" spellcheck="false" />
        <input id="translation" autocomplete="off" spellcheck="false" />
        <p id="hint" hidden></p>
        <p id="status"></p>
      </section>
    </main>
    <script type="module" src="/src/panel.ts"></script>
  </body>
</html>
