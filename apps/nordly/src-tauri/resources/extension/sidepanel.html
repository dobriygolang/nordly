<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nordly</title>
    <script type="module" crossorigin src="/sidepanel.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/sidepanel.css">
  </head>
  <body>
    <main>
      <section id="pair">
        <p id="pair-copy"></p>
        <input id="code" autocomplete="off" spellcheck="false" />
        <button id="save-code" type="button"></button>
      </section>
      <section id="capture" hidden>
        <input id="word" autocomplete="off" spellcheck="false" />
        <button id="translate" type="button"></button>
        <p id="translate-hint"></p>
        <input id="translation" autocomplete="off" spellcheck="false" />
        <div id="marker" class="marker" role="group" aria-label="Card separator">
          <button type="button" data-marker=":::" aria-pressed="true">:::</button>
          <button type="button" data-marker="::" aria-pressed="false">::</button>
        </div>
      </section>
      <p id="hint" hidden></p>
      <p id="status"></p>
      <ul id="history" hidden></ul>
    </main>
  </body>
</html>
