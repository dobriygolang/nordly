syntax = "proto3";

package notes.v1;

option go_package = "github.com/dobriygolang/project-nordly/services/notes/pkg/api/notes/v1;notesv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

enum PublishAccessMode {
  PUBLISH_ACCESS_MODE_UNSPECIFIED = 0;
  PUBLISH_ACCESS_MODE_PUBLIC = 1;
  PUBLISH_ACCESS_MODE_PASSWORD = 2;
}

enum PublishExpiryPolicy {
  PUBLISH_EXPIRY_POLICY_UNSPECIFIED = 0;
  PUBLISH_EXPIRY_POLICY_NEVER = 1;
  PUBLISH_EXPIRY_POLICY_SEVEN_DAYS = 2;
  PUBLISH_EXPIRY_POLICY_THIRTY_DAYS = 3;
  PUBLISH_EXPIRY_POLICY_NINETY_DAYS = 4;
}

service NotesService {
  // Vault
  rpc InitVault(InitVaultRequest) returns (InitVaultResponse) {
    option (google.api.http) = {
      post: "/v1/notes/vault/init"
      body: "*"
    };
  }

  rpc GetVaultSalt(GetVaultSaltRequest) returns (GetVaultSaltResponse) {
    option (google.api.http) = {
      get: "/v1/notes/vault/salt"
    };
  }

  rpc EncryptNote(EncryptNoteRequest) returns (EncryptNoteResponse) {
    option (google.api.http) = {
      post: "/v1/notes/vault/notes/{note_id}/encrypt"
      body: "*"
    };
  }

  // Notes CRUD
  rpc ListNotes(ListNotesRequest) returns (ListNotesResponse) {
    option (google.api.http) = {
      get: "/v1/notes"
    };
  }

  rpc GetNote(GetNoteRequest) returns (GetNoteResponse) {
    option (google.api.http) = {
      get: "/v1/notes/{id}"
    };
  }

  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse) {
    option (google.api.http) = {
      post: "/v1/notes"
      body: "*"
    };
  }

  rpc UpdateNote(UpdateNoteRequest) returns (UpdateNoteResponse) {
    option (google.api.http) = {
      put: "/v1/notes/{id}"
      body: "*"
    };
  }

  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse) {
    option (google.api.http) = {
      delete: "/v1/notes/{id}"
    };
  }

  // Note attachments
  rpc PutNoteAttachment(PutNoteAttachmentRequest) returns (PutNoteAttachmentResponse) {
    option (google.api.http) = {
      put: "/v1/notes/{note_id}/attachments/{id}"
      body: "*"
    };
  }

  rpc GetNoteAttachment(GetNoteAttachmentRequest) returns (GetNoteAttachmentResponse) {
    option (google.api.http) = {
      get: "/v1/notes/{note_id}/attachments/{id}"
    };
  }

  rpc ListNoteAttachments(ListNoteAttachmentsRequest) returns (ListNoteAttachmentsResponse) {
    option (google.api.http) = {
      get: "/v1/notes/{note_id}/attachments"
    };
  }

  rpc DeleteNoteAttachment(DeleteNoteAttachmentRequest) returns (DeleteNoteAttachmentResponse) {
    option (google.api.http) = {
      delete: "/v1/notes/{note_id}/attachments/{id}"
    };
  }

  // Publish
  rpc UnpublishNote(UnpublishNoteRequest) returns (UnpublishNoteResponse) {
    option (google.api.http) = {
      post: "/v1/notes/{note_id}/unpublish"
      body: "*"
    };
  }

  rpc GetPublishStatus(GetPublishStatusRequest) returns (GetPublishStatusResponse) {
    option (google.api.http) = {
      get: "/v1/notes/{note_id}/publish-status"
    };
  }

  rpc ShareNoteToWeb(ShareNoteToWebRequest) returns (ShareNoteToWebResponse) {
    option (google.api.http) = {
      post: "/v1/notes/{note_id}/share-to-web"
      body: "*"
    };
  }

  rpc MakeNotePrivate(MakeNotePrivateRequest) returns (MakeNotePrivateResponse) {
    option (google.api.http) = {
      post: "/v1/notes/{note_id}/make-private"
      body: "*"
    };
  }

  // Public — no auth (published plaintext only).
  rpc GetPublishedNote(GetPublishedNoteRequest) returns (GetPublishedNoteResponse) {
    option (google.api.http) = {
      get: "/v1/notes/public/{slug}"
    };
  }

  rpc AccessPublishedNote(AccessPublishedNoteRequest) returns (AccessPublishedNoteResponse) {
    option (google.api.http) = {
      post: "/v1/notes/public/{slug}/access"
      body: "*"
    };
  }

  rpc GetPublishedNoteAsset(GetPublishedNoteAssetRequest) returns (GetPublishedNoteAssetResponse) {
    option (google.api.http) = {
      get: "/v1/notes/public/{slug}/assets/{asset_id}"
    };
  }
}

message Note {
  string id = 1;
  string title = 2;
  string body_md = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  int32 size_bytes = 6;
  bool encrypted = 7;
}

message NoteSummary {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp updated_at = 3;
  int32 size_bytes = 4;
}

message WikiLinkRef {
  string target_note_id = 1;
  string link_text = 2;
}

message InitVaultRequest {}

message InitVaultResponse {
  string salt_b64 = 1;
  bool initialized = 2;
}

message GetVaultSaltRequest {}

message GetVaultSaltResponse {
  reserved 2;
  reserved "initialized";

  string salt_b64 = 1;
}

message EncryptNoteRequest {
  string note_id = 1;
  string ciphertext_b64 = 2;
}

message EncryptNoteResponse {}

message ListNotesRequest {}

message ListNotesResponse {
  repeated NoteSummary notes = 1;
}

message GetNoteRequest {
  string id = 1;
}

message GetNoteResponse {
  Note note = 1;
}

message CreateNoteRequest {
  string title = 1;
  string body_md = 2;
  repeated WikiLinkRef wiki_links = 3;
}

message CreateNoteResponse {
  Note note = 1;
}

message UpdateNoteRequest {
  string id = 1;
  string title = 2;
  string body_md = 3;
  repeated WikiLinkRef wiki_links = 4;
}

message UpdateNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  string id = 1;
}

message DeleteNoteResponse {}

message NoteAttachment {
  string id = 1;
  string file_name = 2;
  string mime = 3;
  string data_b64 = 4;
  bool encrypted = 5;
  int32 size_bytes = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Metadata only — List must not ship BYTEA bodies.
message NoteAttachmentSummary {
  string id = 1;
  string file_name = 2;
  string mime = 3;
  bool encrypted = 4;
  int32 size_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message PutNoteAttachmentRequest {
  string note_id = 1;
  string id = 2;
  string file_name = 3;
  string mime = 4;
  string data_b64 = 5;
  bool encrypted = 6;
}

message PutNoteAttachmentResponse {
  NoteAttachment attachment = 1;
}

message GetNoteAttachmentRequest {
  string note_id = 1;
  string id = 2;
}

message GetNoteAttachmentResponse {
  NoteAttachment attachment = 1;
}

message ListNoteAttachmentsRequest {
  string note_id = 1;
}

message ListNoteAttachmentsResponse {
  repeated NoteAttachmentSummary attachments = 1;
}

message DeleteNoteAttachmentRequest {
  string note_id = 1;
  string id = 2;
}

message DeleteNoteAttachmentResponse {}

message UnpublishNoteRequest {
  string note_id = 1;
}

message UnpublishNoteResponse {}

message GetPublishStatusRequest {
  string note_id = 1;
}

message GetPublishStatusResponse {
  reserved 5;
  reserved "password_protected";

  bool published = 1;
  string slug = 2;
  string url = 3;
  google.protobuf.Timestamp published_at = 4;
  google.protobuf.Timestamp expires_at = 6;
  PublishAccessMode access_mode = 7;
}

message ShareNoteToWebRequest {
  reserved 3, 5;
  reserved "password_protected", "expires_in_days";

  string note_id = 1;
  string plaintext_md = 2;
  string password = 4;
  repeated PublishedAttachmentInput attachments = 6;
  PublishAccessMode access_mode = 7;
  PublishExpiryPolicy expiry_policy = 8;
}

message PublishedAttachmentInput {
  string id = 1;
  string file_name = 2;
  string mime = 3;
  string data_b64 = 4;
}

message ShareNoteToWebResponse {
  string slug = 1;
  string url = 2;
  google.protobuf.Timestamp published_at = 3;
  bool already_published = 4;
}

message MakeNotePrivateRequest {
  string note_id = 1;
  string ciphertext_b64 = 2;
}

message MakeNotePrivateResponse {}

message GetPublishedNoteRequest {
  string slug = 1;
}

message GetPublishedNoteResponse {
  string title = 1;
  string body_md = 2;
  google.protobuf.Timestamp published_at = 3;
  bool password_required = 4;
}

message AccessPublishedNoteRequest {
  string slug = 1;
  string password = 2;
}

message AccessPublishedNoteResponse {
  string title = 1;
  string body_md = 2;
  google.protobuf.Timestamp published_at = 3;
}

message GetPublishedNoteAssetRequest {
  string slug = 1;
  string asset_id = 2;
}

message GetPublishedNoteAssetResponse {
  string mime = 1;
  string data_b64 = 2;
}
