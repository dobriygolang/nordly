syntax = "proto3";

package sandbox.v1;

option go_package = "github.com/dobriygolang/project-nordly/services/sandbox/pkg/api/sandbox/v1;sandboxv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_GO = 1;
  LANGUAGE_PYTHON = 2;
  LANGUAGE_JAVASCRIPT = 3;
}

enum RunStatus {
  reserved 4;
  reserved "RUN_STATUS_FAILED";

  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_QUEUED = 1;
  RUN_STATUS_RUNNING = 2;
  RUN_STATUS_SUCCESS = 3;
  RUN_STATUS_COMPILE_ERROR = 5;
  RUN_STATUS_RUNTIME_ERROR = 6;
  RUN_STATUS_TIMEOUT = 7;
  RUN_STATUS_INTERNAL_ERROR = 8;
}

service SandboxService {
  rpc RunCode(RunCodeRequest) returns (RunCodeResponse) {
    option (google.api.http) = {
      post: "/v1/sandbox/code-runs"
      body: "*"
    };
  }

  rpc GetCodeRun(GetCodeRunRequest) returns (GetCodeRunResponse) {
    option (google.api.http) = {
      get: "/v1/sandbox/code-runs/{id}"
    };
  }

  rpc FormatCode(FormatCodeRequest) returns (FormatCodeResponse) {
    option (google.api.http) = {
      post: "/v1/sandbox/format"
      body: "*"
    };
  }
}

message RunCodeRequest {
  reserved 1, 2;
  reserved "task_id", "session_task_id";
  Language language = 3;
  string code = 4;
  optional string stdin = 5;
  reserved 6;
  reserved "run_type";
  optional string room_id = 7;
}

message RunCodeResponse {
  CodeRun run = 1;
}

message GetCodeRunRequest {
  string id = 1;
  optional string room_id = 2;
}

message GetCodeRunResponse {
  CodeRun run = 1;
}

message FormatCodeRequest {
  Language language = 1;
  string code = 2;
  optional string room_id = 3;
}

message FormatCodeResponse {
  string code = 1;
}

message CodeRun {
  string id = 1;
  string user_id = 2;
  reserved 3, 4, 7, 14, 15, 16, 17;
  reserved "task_id", "session_task_id", "run_type", "memory_kb", "tests_total", "tests_passed", "test_results";
  Language language = 5;
  RunStatus status = 6;
  optional string stdout = 8;
  optional string stderr = 9;
  optional string compile_output = 10;
  optional string error = 11;
  optional int32 exit_code = 12;
  optional int32 time_ms = 13;
  optional string runner = 18;
  google.protobuf.Timestamp created_at = 19;
  google.protobuf.Timestamp updated_at = 20;
}
